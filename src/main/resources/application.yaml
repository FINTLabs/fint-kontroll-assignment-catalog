fint:
  application-id: fint-kontroll-assignment-catalog
  cache:
    defaultCacheEntryTimeToLiveMillis: 518400000
    defaultCacheHeapSize: 50000000
  integration:
    service:
      authorized-role: https://role-catalog.vigoiks.no/vigo/samtykke/user
  kontroll:
    assignment-catalog:
      pagesize: 50
      reconciliation:
        initial-delay: PT5M
        fixed-delay: PT24H
        response-timeout: 72
      license-enforcement:
        hardstop-enable: true
    slack:
      enabled: false
      api-url: https://slack.com/api/chat.postMessage
      channel-id: fint-kontroll-errors
      # All 5xx responses are notified. Add status codes that are operationally
      # important for a specific environment here.
      additional-http-statuses: 429
      grafana-url: 'https://grafana.flais.io/d/cg2oxl949bpq8d/kontroll-logs?timezone=browser&orgId=1&tab=queries'
    opa:
      url: http://fint-kontroll-opa:8181/v1/data/accessmanagement
    authorization:
      authorized-role: 'https://role-catalog.vigoiks.no/vigo/kontroll/user'
      authorized-admin-role: 'https://role-catalog.vigoiks.no/vigo/kontroll/admin'
      authorized-org-id: 'vigo.no'

spring:
  devtools:
    restart:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://idp.felleskomponent.no/nidp/oauth/nam
  profiles:
    include:
      - db
      - kafka
logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    no.fintlabs.assignment: INFO
#    org.hibernate.SQL: INFO
#    org.hibernate.orm.jdbc.bind: INFO
    no.fintlabs.cache.ehcache: WARN
server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
