fint:
  application-id: fint-kontroll-assignment-catalog
  cache:
    defaultCacheEntryTimeToLiveMillis: 518400000
    defaultCacheHeapSize: 50000000
  integration:
    service:
      authorized-role: https://role-catalog.vigoiks.no/vigo/samtykke/user
  kontroll:
    assignment-catalog:
      pagesize: 50
      reconciliation:
        initial-delay: PT5M
        fixed-delay: PT24H
        response-timeout: 72
      license-enforcement:
        hardstop-enable: true
    slack:
      enabled: false
      additional-http-statuses: [409, 404, 422]
    opa:
      url: http://fint-kontroll-opa:8181/v1/data/accessmanagement
    authorization:
      authorized-role: 'https://role-catalog.vigoiks.no/vigo/kontroll/user'
      authorized-admin-role: 'https://role-catalog.vigoiks.no/vigo/kontroll/admin'
      authorized-org-id: 'vigo.no'

spring:
  devtools:
    restart:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://idp.felleskomponent.no/nidp/oauth/nam
  profiles:
    include:
      - db
      - kafka
logging:
  # Keep the correlation ID for Grafana searches; omit the thread and span ID.
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [correlationId=%X{correlationId:-}] %logger{36} : %msg%n%wEx'
  level:
    root: INFO
    org.apache.kafka: WARN
    no.fintlabs.assignment: INFO
#    org.hibernate.SQL: INFO
#    org.hibernate.orm.jdbc.bind: INFO
    no.fintlabs.cache.ehcache: WARN
server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
